name: Release Automation

on:
  push:
    tags:
      - 'v*'

env:
  NSPFF_PROD_KEYS: ${{ secrets.NSPFF_PROD_KEYS }}
  NSPFF_TITLE_KEYS: ${{ secrets.NSPFF_TITLE_KEYS }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Test Suite
        run: flutter test

  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Stage artifacts
        run: |
          mkdir -p staging
          cp build/app/outputs/flutter-apk/app-release.apk staging/nspff-android.apk
          cp build/app/outputs/bundle/release/app-release.aab staging/nspff-android.aab

      - name: Generate SHA-256 Checksums
        run: |
          cd staging
          shasum -a 256 nspff-android.apk | awk '{print $1}' > nspff-android.apk.sha256
          shasum -a 256 nspff-android.aab | awk '{print $1}' > nspff-android.aab.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: staging/*

  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Archive Web
        run: |
          cd build
          7z a -tzip "$GITHUB_WORKSPACE/nspff-web.zip" web

      - name: Generate SHA-256 Checksum
        run: shasum -a 256 nspff-web.zip | awk '{print $1}' > nspff-web.zip.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            nspff-web.zip
            nspff-web.zip.sha256

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/nspff.app"
          DMG_PATH="$GITHUB_WORKSPACE/nspff-macos.dmg"
          # Create a temporary DMG directory
          DMG_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          # Create the DMG
          hdiutil create -volname "NSPFF" -srcfolder "$DMG_DIR" -ov -format UDZO "$DMG_PATH"
          rm -rf "$DMG_DIR"

      - name: Generate SHA-256 Checksum
        run: shasum -a 256 nspff-macos.dmg | awk '{print $1}' > nspff-macos.dmg.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            nspff-macos.dmg
            nspff-macos.dmg.sha256

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create portable ZIP
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/nspff-windows-portable.zip" .
        shell: bash

      - name: Create MSIX
        run: dart run msix:create
        shell: bash

      - name: Stage MSIX
        run: |
          mkdir -p staging
          cp build/windows/x64/runner/Release/nspff.msix staging/nspff-windows.msix || true
          # msix package may output to different locations; find it
          if [ ! -f staging/nspff-windows.msix ]; then
            find build -name "*.msix" -exec cp {} staging/nspff-windows.msix \;
          fi
        shell: bash

      - name: Generate SHA-256 Checksums
        run: |
          powershell -Command "(Get-FileHash -Algorithm SHA256 'nspff-windows-portable.zip').Hash" > nspff-windows-portable.zip.sha256
          if [ -f staging/nspff-windows.msix ]; then
            cd staging
            powershell -Command "(Get-FileHash -Algorithm SHA256 'nspff-windows.msix').Hash" > nspff-windows.msix.sha256
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            nspff-windows-portable.zip
            nspff-windows-portable.zip.sha256
            staging/nspff-windows.msix
            staging/nspff-windows.msix.sha256

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
          # AppImage tooling — extract since FUSE is unavailable in CI containers
          sudo apt-get install -y libfuse2 wget
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create AppImage
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          APPDIR="build/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy the bundle contents
          cp -r "$BUNDLE"/* "$APPDIR/usr/bin/"

          # Copy shared libraries
          if [ -d "$BUNDLE/lib" ]; then
            cp -r "$BUNDLE/lib"/* "$APPDIR/usr/lib/" 2>/dev/null || true
          fi

          # Create .desktop file
          cat > "$APPDIR/nspff.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=NSPFF
          Comment=NSP Fast Forward - Nintendo Switch NSP Forwarder
          Exec=nspff
          Icon=nspff
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP

          # Copy icon — both in hicolor and AppDir root for appimagetool discovery
          if [ -f "assets/images/icon.png" ]; then
            cp "assets/images/icon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/nspff.png"
            cp "assets/images/icon.png" "$APPDIR/nspff.png"
          fi

          # AppRun
          cat > "$APPDIR/AppRun" <<'RUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/nspff" "$@"
          RUN
          chmod +x "$APPDIR/AppRun"

          # Build AppImage (extracted appimagetool runs without FUSE)
          ARCH=x86_64 appimagetool "$APPDIR" "$GITHUB_WORKSPACE/nspff-linux.AppImage"

      - name: Create DEB package
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          DEBROOT="build/deb"
          mkdir -p "$DEBROOT/DEBIAN"
          mkdir -p "$DEBROOT/usr/bin"
          mkdir -p "$DEBROOT/usr/lib/nspff"
          mkdir -p "$DEBROOT/usr/share/applications"
          mkdir -p "$DEBROOT/usr/share/icons/hicolor/256x256/apps"

          # Copy bundle
          cp -r "$BUNDLE"/* "$DEBROOT/usr/lib/nspff/"

          # Create wrapper script
          cat > "$DEBROOT/usr/bin/nspff" <<'WRAPPER'
          #!/bin/bash
          exec /usr/lib/nspff/nspff "$@"
          WRAPPER
          chmod +x "$DEBROOT/usr/bin/nspff"

          # .desktop file
          cat > "$DEBROOT/usr/share/applications/nspff.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=NSPFF
          Comment=NSP Fast Forward - Nintendo Switch NSP Forwarder
          Exec=/usr/bin/nspff
          Icon=nspff
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP

          # Icon
          if [ -f "assets/images/icon.png" ]; then
            cp "assets/images/icon.png" "$DEBROOT/usr/share/icons/hicolor/256x256/apps/nspff.png"
          fi

          # Control file
          SIZE=$(du -sk "$DEBROOT" | cut -f1)
          cat > "$DEBROOT/DEBIAN/control" <<CONTROL
          Package: nspff
          Version: 0.9.1
          Architecture: amd64
          Maintainer: NSPFF Project Contributors
          Description: NSP Fast Forward - Nintendo Switch NSP Forwarder
           NSPFF generates Nintendo Switch NSP forwarder packages for
           standalone NRO applications and RetroArch ROMs.
          Depends: libgtk-3-0, liblzma5, libsecret-1-0, libjsoncpp25
          Installed-Size: ${SIZE}
          CONTROL

          # Build DEB
          dpkg-deb --build --root-owner-group "$DEBROOT" "$GITHUB_WORKSPACE/nspff-linux.deb"

      - name: Generate SHA-256 Checksums
        run: |
          if [ -f nspff-linux.AppImage ]; then
            shasum -a 256 nspff-linux.AppImage | awk '{print $1}' > nspff-linux.AppImage.sha256
          fi
          shasum -a 256 nspff-linux.deb | awk '{print $1}' > nspff-linux.deb.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            nspff-linux.AppImage
            nspff-linux.AppImage.sha256
            nspff-linux.deb
            nspff-linux.deb.sha256

  release:
    name: Publish GitHub Release
    needs: [build-android, build-web, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify Artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/
          echo "=== Checksum files ==="
          ls -la artifacts/*.sha256 2>/dev/null || echo "WARNING: No checksum files found"
          echo "=== Expected files ==="
          echo "nspff-android.apk + .sha256"
          echo "nspff-android.aab + .sha256"
          echo "nspff-web.zip + .sha256"
          echo "nspff-macos.dmg + .sha256"
          echo "nspff-windows-portable.zip + .sha256"
          echo "nspff-windows.msix + .sha256"
          echo "nspff-linux.AppImage + .sha256"
          echo "nspff-linux.deb + .sha256"

      - name: Write Release Notes
        run: |
          cat > release-notes.md <<'EOF'
          ## NSPFF ${{ github.ref_name }}

          NSP Fast Forward — a Flutter application for generating Nintendo Switch NSP forwarder packages for standalone NRO applications and RetroArch ROMs.

          ### Downloads

          | Platform | Artifact | Type |
          |----------|---------|------|
          | Android | `nspff-android.apk` | APK (sideload) |
          | Android | `nspff-android.aab` | App Bundle (Play Store) |
          | macOS | `nspff-macos.dmg` | Disk Image |
          | Windows | `nspff-windows.msix` | MSIX Installer |
          | Windows | `nspff-windows-portable.zip` | Portable ZIP |
          | Linux | `nspff-linux.AppImage` | AppImage |
          | Linux | `nspff-linux.deb` | Debian/Ubuntu Package |
          | Web | `nspff-web.zip` | Web Bundle |

          Each artifact includes a `.sha256` checksum file for integrity verification.

          ### Installation

          **Android:** Enable "Install unknown apps" and open the APK. The AAB is for Play Store distribution.

          **macOS:** Open the DMG, drag NSPFF to Applications. On first launch, right-click and select Open to bypass Gatekeeper.

          **Windows:** Double-click the MSIX to install (requires sideloading enabled). Alternatively, extract the portable ZIP and run `nspff.exe`.

          **Linux:** Make the AppImage executable (`chmod +x nspff-linux.AppImage`) and run. For Debian/Ubuntu, install with `sudo dpkg -i nspff-linux.deb`.

          **Web:** Extract the ZIP and serve the contents from any static web server.

          ### Prerequisites

          NSPFF requires a valid `prod.keys` file to sign NSP packages. Use [Lockpick_RCM](https://github.com/shchmue/Lockpick_RCM) on your Switch to dump keys, then import them via the Keys Manager tab. See the Guide tab in-app for detailed instructions.

          ### Security

          User-supplied cryptographic keys are stored locally using platform secure storage and are never transmitted, committed, or bundled into release artifacts. Users are responsible for obtaining their own key material in compliance with applicable laws.

          ---
          This is a pre-release. Report issues on the [issue tracker](https://github.com/jxoesneon/NSPFF/issues).
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "NSPFF ${{ github.ref_name }}" \
            --prerelease \
            --generate-notes \
            --notes-body-file release-notes.md \
            --target main

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          for file in *; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "${{ github.ref_name }}" "$file" --clobber
            fi
          done
