name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Load real key material from repository-level GitHub Secrets.
  # The IDE may show "Context access might be invalid" until these secrets are
  # configured and the GitHub Actions extension is refreshed; the workflow is
  # valid and will receive the values at runtime when the secrets exist.
  NSPFF_PROD_KEYS: ${{ secrets.NSPFF_PROD_KEYS }}
  NSPFF_TITLE_KEYS: ${{ secrets.NSPFF_TITLE_KEYS }}

jobs:
  analyze-and-test:
    name: Static Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Unit Test Suite
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info

  build:
    name: Build (${{ matrix.target }})
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-apk
            os: ubuntu-latest
            build_cmd: flutter build apk --release
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            artifact_name: nspff-android-apk
          - target: android-aab
            os: ubuntu-latest
            build_cmd: flutter build appbundle --release
            artifact_path: build/app/outputs/bundle/release/app-release.aab
            artifact_name: nspff-android-aab
          - target: web
            os: ubuntu-latest
            build_cmd: flutter build web --release
            artifact_path: build/web
            artifact_name: nspff-web
          - target: macos
            os: macos-latest
            build_cmd: flutter build macos --release
            artifact_path: build/macos/Build/Products/Release/nspff.app
            artifact_name: nspff-macos
          - target: windows
            os: windows-latest
            build_cmd: flutter build windows --release
            artifact_path: build/windows/x64/runner/Release
            artifact_name: nspff-windows
          - target: linux
            os: ubuntu-latest
            build_cmd: |
              sudo apt-get update -y
              sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev
              flutter build linux --release
            artifact_path: build/linux/x64/release/bundle
            artifact_name: nspff-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        if: startsWith(matrix.target, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        run: ${{ matrix.build_cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
