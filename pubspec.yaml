name: nsp_forwarder
description: "A private Flutter Android application for generating Nintendo Switch NRO and RetroArch NSP forwarders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  crypto: ^3.0.3
  image: ^4.1.7
  path: ^1.9.0
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
