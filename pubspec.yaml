name: nspff
description: "NSPFF (NSP Fast Forward) - A Flutter application for forwarding Nintendo Switch NRO apps and RetroArch ROMs across Android, macOS, Windows, Linux, and web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  crypto: ^3.0.3
  image: ^4.1.7
  path: ^1.9.0
  shared_preferences: ^2.2.2
  file_picker: ^12.1.2
  path_provider: ^2.1.2
  google_fonts: ^8.2.1
  http: ^1.2.0
  iconic_morph: ^1.9.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_picker_platform_interface: ^3.2.0
  cross_file: ^0.3.5+5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
