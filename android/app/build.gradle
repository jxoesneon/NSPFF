plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "io.n8.nspff"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "io.n8.nspff"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 1
        versionName "0.9.0"
    }

    signingConfigs {
        release {
            // Release signing configuration. Provide a real keystore via
            // environment variables for production releases:
            //   NSPFF_KEYSTORE_FILE, NSPFF_KEYSTORE_PASSWORD,
            //   NSPFF_KEY_ALIAS, NSPFF_KEY_PASSWORD
            def keystoreFile = System.getenv("NSPFF_KEYSTORE_FILE")
            if (keystoreFile != null && file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("NSPFF_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("NSPFF_KEY_ALIAS") ?: ""
                keyPassword System.getenv("NSPFF_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            // Use the release signing config only when a keystore is
            // configured; otherwise fall back to debug signing so CI
            // can produce builds without a release keystore.
            def keystoreFile = System.getenv("NSPFF_KEYSTORE_FILE")
            if (keystoreFile != null && file(keystoreFile).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source "../.."
}
